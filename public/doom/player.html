<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOOM</title>
  <!-- Isolé dans une iframe : le CSS de js-dos réinitialise les styles globaux. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
  <script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js"></script>
  <style>html, body, #dos { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }</style>
</head>
<body>
  <div id="dos"></div>
  <script>
    Dos(document.getElementById("dos"), {
      url: "/doom/doom-shareware.jsdos",
      pathPrefix: "https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/",
      autoStart: true,
      kiosk: true,
      noCloud: true,
      theme: "dark",
    });
  </script>
</body>
</html>
